<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zuno Bloom</title>
<link rel="icon" href="/badges/bloom-new.png">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; font-family: Figtree, "Segoe UI", sans-serif; color: #dce8e5;
    background: radial-gradient(90% 90% at 0% 0%, #0f5f57 0%, transparent 60%), radial-gradient(90% 90% at 100% 100%, #5b2380 0%, transparent 60%), #10171a; }
  .card { width: min(460px, 100%); text-align: center; padding: 36px 28px; border-radius: 26px; background: rgba(12, 19, 18, .72); box-shadow: 0 24px 70px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.08); backdrop-filter: blur(10px); }
  img { width: 150px; height: 150px; filter: drop-shadow(0 12px 30px rgba(4,197,174,.45)); animation: f 5s ease-in-out infinite; }
  @keyframes f { 50% { transform: translateY(-8px) rotate(-3deg); } }
  h1 { font: 700 30px Fredoka, sans-serif; margin: 12px 0 8px; color: #fff; }
  p { margin: 0 0 10px; line-height: 1.5; color: #b6c9c5; }
  .small { font-size: 13px; color: #7f9692; margin-top: 18px; }
  @media (prefers-reduced-motion: reduce) { img { animation: none; } }
</style>
</head>
<body>
  <div class="card">
    <img src="/badges/bloom-new-512.png" alt="">
    <h1 id="t">Welcome to Bloom! 🌸</h1>
    <p id="m">Your payment went through. Head back to Zuno: your perks and your Bloom badge turn on by themselves in a few seconds.</p>
    <p class="small">You can close this tab.</p>
  </div>
  <script src="/bloom-thanks.js"></script>
</body>
</html>
