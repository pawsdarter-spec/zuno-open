  <header class="titlebar hidden" id="titlebar"></header>
  <div class="splash" id="splash"><div class="splash-inner" id="splash-art"></div>
    <div class="sk53-auth" aria-hidden="true"><i></i><b></b><b style="width:80%"></b><b class="f"></b><b class="f"></b><b class="btn"></b></div>

      <div class="sk45-rail"><i></i><i></i><i></i><i></i><i></i></div>

      <div class="sk45-main"><b class="top"></b><div class="sk45-msgs"><p><i></i><b></b><b class="s"></b></p><p><i></i><b class="s"></b></p><p><i></i><b></b><b></b><b class="s"></b></p><p><i></i><b class="s"></b></p></div><b class="box"></b></div>
    </div></div>
  <!-- Sign in / sign up -->
  <div id="auth" class="auth hidden">
    <form id="auth-form" class="auth-card" autocomplete="on">
      <div class="auth-mascot" id="auth-mascot"></div>
      <h1 id="auth-title">Welcome back!</h1>
      <p id="auth-sub" class="muted" style="margin-bottom:20px">We're so excited to see you again!</p>
      <label class="field register-only">Email <span class="req">*</span>
        <input name="email" type="email" maxlength="254" autocomplete="email" autocapitalize="off" spellcheck="false">
      </label>
      <label class="field register-only">Display name
        <input name="displayName" maxlength="32" autocomplete="nickname">
      </label>
      <label class="field"><span id="login-label">Email or Username</span> <span class="req">*</span>
        <input name="username" required maxlength="254" autocomplete="username" autocapitalize="off" spellcheck="false">
      </label>
      <label class="field">Password <span class="req">*</span>
        <input name="password" type="password" required minlength="6" autocomplete="current-password">
      </label>
      <div id="turnstile-wrap" class="register-only" style="display:none;text-align:left;margin:12px 0">
        <div id="turnstile-widget"></div>
        <p class="muted small" id="turnstile-help"></p>
      </div>
      <div id="auth-error" class="form-error"></div>
      <p class="muted small terms-note" id="terms-note">By signing up, you agree to Zuno's <a href="/terms" target="_blank">Terms of Service</a> and <a href="/privacy" target="_blank">Privacy Policy</a>.</p>
      <button class="btn btn-primary btn-block" id="auth-submit">Log In</button>
      <p class="muted small"><span id="auth-switch-text">Need an account?</span>
        <a href="/signup" id="auth-switch">Register</a></p>
      <a href="#" class="small hidden" id="auth-server" style="display:block;text-align:left;margin-top:8px">Server settings</a>
    </form>
  </div>

  <!-- Main app -->
  <div id="app" class="app hidden">
    <nav class="rail">
      <button class="rail-btn active" data-tip="Direct Messages" id="home-btn"><img src="/logo.png" alt="Home"></button>
      <div class="rail-sep"></div>
      <div id="server-rail" class="server-rail"></div>
      <button class="rail-btn add" data-tip="Add a Server" id="add-server-btn">+</button>
    </nav>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top" id="sidebar-top"></div>
      <div class="sidebar-scroll" id="sidebar-scroll"></div>
      <div id="voice-bar"></div>
      <div class="user-panel" id="user-panel"></div>
    </aside>

    <main class="main" id="main"></main>
  </div>
